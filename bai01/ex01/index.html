<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thơ Bốn Mùa</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "Times New Roman", Times, serif;
        }

        .khung-tho {
            width: 640px;
            background-color: #FFFDE7;
            border: 1px solid #9E9E9E;
            padding: 24px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #D40000;
            background-color: #FFD9E6;
            font-size: 26px;
            font-weight: bold;
            padding: 6px 0;
            margin: 0 0 20px 0;
        }

        .kho {
            font-style: italic;
            font-weight: bold;
            line-height: 1.7;
            margin: 14px 0;
        }

        .xanh {
            color: #0033CC;
        }

        .do {
            color: #D40000;
        }

        hr {
            width: 55%;
            border: none;
            border-top: 1px solid #0033CC;
            margin: 14px auto;
        }
    </style>
</head>
<body>

    <article class="khung-tho">
        <h1>BỐN MÙA</h1>

        <p class="kho xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="kho do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <p class="kho xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </article>

</body>
</html>
